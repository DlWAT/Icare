<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icare Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Icare</div>
      <nav>
        <a class="nav-link {{ 'active' if request.path == '/' else '' }}" href="/">Accueil</a>
        <a class="nav-link {{ 'active' if request.path == '/experiment' else '' }}" href="/experiment">Direct</a>
        <a class="nav-link {{ 'active' if request.path == '/sequence' else '' }}" href="/sequence">Séquence</a>
        <a class="nav-link {{ 'active' if request.path == '/live' else '' }}" href="/live">Live</a>
      </nav>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
