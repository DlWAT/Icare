{% extends 'base.html' %}
{% block content %}
<section>
  <h1>Séquence</h1>
  <div class="grid">
    <div class="panel">
      <h3>Fichiers</h3>
      <div class="row">
        <input type="text" id="seq-save-name" placeholder="Nom du fichier (ex: my_show)" />
        <button id="btn-seq-save" class="btn-primary">Sauvegarder</button>
      </div>
      <ul id="seq-file-list" class="list"></ul>
    </div>

    <div class="panel" style="grid-column: 1 / -1;">
      <h3>Édition</h3>
      <div class="row">
        <label>Module
          <select id="seq-module-select"></select>
        </label>
        <label>#Ligne
          <input type="number" id="seq-line" placeholder="1" min="1" value="1" />
        </label>
        <label>#Tps
          <input type="number" id="seq-tps" placeholder="1" min="1" value="1" />
        </label>
        <label>Fréquence
          <input type="number" id="seq-freq" placeholder="60" min="1" value="60" />
        </label>
      </div>
      <div class="row">
        <input type="color" id="seq-color-1" value="#ff0000" />
        <input type="color" id="seq-color-2" value="#0000ff" />
        <button id="btn-seq-uni">Uniform</button>
        <button id="btn-seq-fondu">Fondu</button>
        <button id="btn-seq-strobe">Strobe</button>
        <span class="spacer"></span>
        <button id="btn-seq-add-row">+ Ligne</button>
        <button id="btn-seq-clear-cell" class="btn-small">Effacer cellule</button>
      </div>
      <div class="table-wrap">
        <table id="seq-table" class="table"></table>
      </div>
      <p class="muted small">Astuce&nbsp;: les cellules de fonction sont éditables directement. Le caractère <code>|</code> continue l'effet précédent.</p>
    </div>
  </div>
</section>
{% endblock %}
