{% extends 'base.html' %}
{% block content %}
<section>
  <h1>Live</h1>
  <div class="grid">
    <div class="panel">
      <h3>Séquences</h3>
      <ul id="live-file-list" class="list"></ul>
    </div>

    <div class="panel">
      <h3>Modules</h3>
      <div class="row">
        <button id="btn-live-select-all" class="btn-small">Tout sélectionner</button>
        <button id="btn-live-unselect-all" class="btn-small">Tout désélectionner</button>
      </div>
      <ul id="live-modules" class="list"></ul>
    </div>

    <div class="panel">
      <h3>Lecture</h3>
      <div class="row">
        <label>BPM <span class="val" id="val-bpm">60</span>
          <input type="number" id="live-bpm" min="20" max="300" value="60" />
        </label>
        <button id="btn-tap" class="btn-primary tap-btn" title="Cliquez en rythme pour caler le BPM">TAP</button>
        <button id="btn-tap-reset" class="btn-small">Reset</button>
      </div>
      <div class="row transport">
        <button id="btn-live-play" class="btn-primary">▶ Play</button>
        <button id="btn-live-pause">⏸ Pause</button>
        <button id="btn-live-stop">⏹ Stop</button>
        <button id="btn-live-prev">⏮</button>
        <button id="btn-live-next">⏭</button>
      </div>
      <div class="progress" title="Progression">
        <div id="live-progress-bar" class="progress-bar" style="width:0%"></div>
      </div>
      <div class="row">
        <span id="live-section" class="muted">Section: -</span>
        <span class="spacer"></span>
        <span id="live-counter" class="muted">0 / 0</span>
      </div>
    </div>

    <div class="panel" style="grid-column: 1 / -1;">
      <h3>Visualisation 3D</h3>
      <div id="live3d" style="width:100%; height:420px;"></div>
    </div>
  </div>
</section>
{% endblock %}
